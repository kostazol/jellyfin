name: Verify localized alphabet server style

on:
  push:
    branches:
      - build/localized-alphabet-image
    paths:
      - .github/workflows/verify-localized-alphabet-style.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin
          ref: feature/localized-alphabet-navigation

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run upstream format check
        run: dotnet format --verify-no-changes --verbosity minimal
