name: Verify localized alphabet server style

on:
  push:
    branches:
      - build/localized-alphabet-image
    paths:
      - .github/workflows/verify-localized-alphabet-style.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin
          ref: feature/localized-alphabet-navigation
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply upstream formatter
        run: dotnet format --verbosity minimal

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git status --short
          if git diff --quiet; then
            echo "No formatting changes required"
          else
            git add -A
            git commit -m "style: apply dotnet format"
            git push origin HEAD:feature/localized-alphabet-navigation
          fi
