name: Build localized alphabet Jellyfin image

on:
  push:
    branches:
      - build/localized-alphabet-image
    paths:
      - .github/workflows/build-localized-alphabet-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Jellyfin server feature
        uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin
          ref: feature/localized-alphabet-navigation
          path: jellyfin-server

      - name: Checkout Jellyfin Web feature
        uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin-web
          ref: feature/localized-alphabet-navigation
          path: jellyfin-web

      - name: Checkout test image helpers
        uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin
          ref: build/localized-alphabet-image
          path: build-helper

      - name: Capture feature versions
        id: versions
        run: |
          echo "server=$(git -C jellyfin-server rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "web=$(git -C jellyfin-web rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore rc5 alpha picker DOM for test image
        working-directory: jellyfin-web
        run: python3 ../build-helper/scripts/make-picker-rc5-compatible.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jellyfin-web/package-lock.json

      - name: Build Jellyfin Web
        working-directory: jellyfin-web
        env:
          JELLYFIN_VERSION: 12.0-localized-alphabet
        run: |
          npm ci --no-audit
          npm run build:check
          npm run build:production

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Jellyfin server
        working-directory: jellyfin-server
        run: >-
          dotnet publish Jellyfin.Server/Jellyfin.Server.csproj
          --runtime linux-x64
          --configuration Release
          --output ../out-server
          --self-contained
          -p:DebugSymbols=false
          -p:DebugType=none

      - name: Create runtime Dockerfile
        run: |
          cat > Dockerfile.runtime-test <<'EOF'
          FROM jellyfin/jellyfin:12.0-rc5
          USER root
          RUN rm -rf /jellyfin/*
          COPY out-server /jellyfin
          COPY jellyfin-web/dist /jellyfin/jellyfin-web
          RUN chmod +x /jellyfin/jellyfin
          LABEL org.opencontainers.image.source="https://github.com/kostazol/jellyfin"
          LABEL org.opencontainers.image.description="Jellyfin 12 localized alphabet navigation test image"
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime-test
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kostazol/jellyfin-localized-alphabet:test
            ghcr.io/kostazol/jellyfin-localized-alphabet:server-${{ steps.versions.outputs.server }}-web-${{ steps.versions.outputs.web }}

      - name: Smoke test Jellyfin container
        run: |
          set -euo pipefail
          docker run -d --name jellyfin-localized-smoke -p 18096:8096 \
            ghcr.io/kostazol/jellyfin-localized-alphabet:test
          cleanup() {
            docker logs jellyfin-localized-smoke || true
            docker rm -f jellyfin-localized-smoke || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18096/health >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:18096/web/index.html >/dev/null 2>&1; then
              echo "Jellyfin health and web endpoints are ready"
              exit 0
            fi

            if ! docker inspect -f '{{.State.Running}}' jellyfin-localized-smoke | grep -q true; then
              echo "Jellyfin container exited before becoming ready"
              exit 1
            fi

            sleep 2
          done

          echo "Jellyfin did not become fully ready within the timeout"
          exit 1

      - name: Push validated image
        run: |
          docker push ghcr.io/kostazol/jellyfin-localized-alphabet:test
          docker push ghcr.io/kostazol/jellyfin-localized-alphabet:server-${{ steps.versions.outputs.server }}-web-${{ steps.versions.outputs.web }}
