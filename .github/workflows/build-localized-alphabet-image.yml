name: Build localized alphabet Jellyfin image

on:
  push:
    branches:
      - build/localized-alphabet-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Checkout Jellyfin server feature
        uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin
          ref: feature/localized-alphabet-navigation
          path: jellyfin-server

      - name: Checkout Jellyfin Web feature
        uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin-web
          ref: feature/localized-alphabet-navigation
          path: jellyfin-web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rc5-based test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.localized-alphabet-test
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kostazol/jellyfin-localized-alphabet:test-rc5
            ghcr.io/kostazol/jellyfin-localized-alphabet:rc5-server-131759a-web-22feeef
          build-args: |
            JELLYFIN_VERSION=12.0-localized-alphabet
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image name
        run: echo 'ghcr.io/kostazol/jellyfin-localized-alphabet:test-rc5'
