name: Fix PR 17742 migration duplication

on:
  push:
    branches:
      - build/localized-alphabet-image
    paths:
      - scripts/fix-pr17742-migration-duplication.py
      - .github/workflows/fix-pr17742-migration-duplication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          ref: build/localized-alphabet-image
          path: tooling

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/localized-alphabet-navigation
          fetch-depth: 0
          path: source

      - name: Apply migration duplication fix
        working-directory: source
        run: |
          python3 ../tooling/scripts/fix-pr17742-migration-duplication.py
          git diff --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify formatting
        working-directory: source
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Restore
        working-directory: source
        run: dotnet restore

      - name: Build
        working-directory: source
        run: dotnet build --no-restore

      - name: Test controller
        working-directory: source
        run: dotnet test tests/Jellyfin.Controller.Tests/Jellyfin.Controller.Tests.csproj --no-build --no-restore

      - name: Test server implementations
        working-directory: source
        run: dotnet test tests/Jellyfin.Server.Implementations.Tests/Jellyfin.Server.Implementations.Tests.csproj --no-build --no-restore

      - name: Exercise startup migrations
        working-directory: source
        run: dotnet test tests/Jellyfin.Server.Integration.Tests/Jellyfin.Server.Integration.Tests.csproj -c Release --filter Jellyfin.Server.Integration.Tests.OpenApiSpecTests

      - name: Commit and push fix
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jellyfin.Server/Migrations/Routines/20260829190000_RefreshSortNameInitials.cs
          git commit -m "Use explicit batches for SortNameInitial migration"
          git push origin HEAD:feature/localized-alphabet-navigation
