name: Rebase localized alphabet feature branches

on:
  push:
    branches:
      - build/localized-alphabet-image

permissions:
  contents: write

jobs:
  rebase-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin
          ref: feature/localized-alphabet-navigation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebase onto upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jellyfin/jellyfin.git
          git fetch upstream master
          git rebase upstream/master
          git push --force-with-lease origin HEAD:feature/localized-alphabet-navigation

  rebase-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kostazol/jellyfin-web
          ref: feature/localized-alphabet-navigation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebase onto upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jellyfin/jellyfin-web.git
          git fetch upstream master
          git rebase upstream/master
          git push --force-with-lease origin HEAD:feature/localized-alphabet-navigation
